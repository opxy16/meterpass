[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.28"
# Aevum runs the Shanghai EVM: no MCOPY / TSTORE / TLOAD / blob opcodes.
evm_version = "shanghai"
optimizer = true
optimizer_runs = 2000
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read-write", path = "../deployments" }, { access = "read", path = "./out" }]
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 1024

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 512
depth = 128

[rpc_endpoints]
aevum = "https://rpc-test.qday.info"

[fmt]
line_length = 110

[lint]
lint_on_build = false
